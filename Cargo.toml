[package]
name = "rpass"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Local-first password manager for Windows and Linux/WSL"

[dependencies]
argon2 = { version = "0.5", features = ["std"], default-features = false }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
getrandom = "0.2"
thiserror = "1"
crc32c = "0.6"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
base32 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Ole",
] }

[dev-dependencies]