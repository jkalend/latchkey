[package]
name = "latchkey"
version = "0.3.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Local-first password manager for Windows and Linux/WSL"
readme = "README.md"
documentation = "https://docs.rs/latchkey"
keywords = ["password-manager", "cli", "tui", "security"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
argon2 = { version = "0.5", features = ["std", "zeroize"], default-features = false }
aes-gcm = { version = "0.10", features = ["zeroize"] }
# These features are not forwarded by aes-gcm/ghash.
aes = { version = "0.8", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
getrandom = "0.2"
thiserror = "1"
crc32c = "0.6"
clap = { version = "4", features = ["derive"] }
csv = "1"
clap_complete = "4"
rpassword = "7"
base32 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
ratatui = "0.30"
crossterm = "0.29"
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi", # WNDCLASSW lives behind this gate
] }

[dev-dependencies]

[features]
# Harness-only KDF floor: substitutes migration/creation default KDF
# parameters (8 MiB, t=1) so fuzz targets can exercise the full
# cryptographic path without the ~1 s production derivation per input.
# Never enabled in production builds.
fuzz-fast-kdf = []
