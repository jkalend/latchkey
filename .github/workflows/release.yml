name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain branch 1.98
      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290
        with:
          toolchain: 1.98
      - name: Match tag to Cargo package version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "latchkey") | .version')"
          test "$GITHUB_REF_NAME" = "v${version}"

  linux:
    name: Build Linux artifact
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain branch 1.98
      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290
        with:
          toolchain: 1.98
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Package and smoke copied binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="latchkey-${TAG}-x86_64-unknown-linux-gnu"
          mkdir "$dir"
          cp target/x86_64-unknown-linux-gnu/release/latchkey README.md LICENSE-MIT LICENSE-APACHE "$dir/"

          bin="$dir/latchkey"
          test "$("$bin" --version)" = "latchkey ${TAG#v}"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          vault="$smoke_dir/vault.bin"
          printf '%s\n%s\n' artifact-smoke-master artifact-smoke-master |
            "$bin" --vault "$vault" --from-stdin init
          printf '%s\n' artifact-smoke-master |
            "$bin" --vault "$vault" --from-stdin add artifact-smoke --username ci --generate
          list_output="$(printf '%s\n' artifact-smoke-master |
            "$bin" --vault "$vault" --from-stdin list)"
          [[ "$list_output" == *artifact-smoke* ]]
          check_output="$(printf '%s\n' artifact-smoke-master |
            "$bin" --vault "$vault" --from-stdin check)"
          [[ "$check_output" == *"vault check: ok"* ]]
          [[ "$check_output" == *"records: 1 live, 0 tombstone"* ]]

          tar -czf "${dir}.tar.gz" "$dir"
      # actions/upload-artifact v4.7.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-release
          path: latchkey-*.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows artifact
    runs-on: windows-latest
    needs: metadata
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain branch 1.98
      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290
        with:
          toolchain: 1.98
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package and smoke copied binary
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = "latchkey-$env:TAG-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/latchkey.exe, README.md, LICENSE-MIT, LICENSE-APACHE $dir

          $binary = Join-Path $dir "latchkey.exe"
          $version = $env:TAG.TrimStart("v")
          if ((& $binary --version) -ne "latchkey $version") {
            throw "packaged binary version does not match $env:TAG"
          }
          $vault = Join-Path $env:RUNNER_TEMP "latchkey-artifact-smoke-$([guid]::NewGuid()).bin"
          @("artifact-smoke-master", "artifact-smoke-master") |
            & $binary --vault $vault --from-stdin init
          "artifact-smoke-master" |
            & $binary --vault $vault --from-stdin add artifact-smoke --username ci --generate
          # Join to a single string: pipeline capture yields an array of
          # lines, and -notmatch on an array returns non-matching elements
          # (truthy even when a line matches) instead of a bool.
          $listOutput = ("artifact-smoke-master" |
            & $binary --vault $vault --from-stdin list) -join "`n"
          if ($listOutput -notmatch "artifact-smoke") {
            throw "packaged binary list smoke did not find the added item"
          }
          $checkOutput = ("artifact-smoke-master" |
            & $binary --vault $vault --from-stdin check) -join "`n"
          if ($checkOutput -notmatch "vault check: ok" -or
              $checkOutput -notmatch "records: 1 live, 0 tombstone") {
            throw "packaged binary check smoke failed"
          }
          Remove-Item $vault -Force

          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      # actions/upload-artifact v4.7.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: latchkey-*.zip
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      # actions/attest-build-provenance v3.2.0 — signs the exact release
      # archive bytes (the digest matches the uploaded asset).
      - uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publish GitHub release
    needs: [linux, windows, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      # softprops/action-gh-release v2.3.4
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: dist/*
