[package]
name = "rpass"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Local-first password manager for Windows and Linux/WSL"

[dependencies]
argon2 = { version = "0.5", features = ["std"], default-features = false }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
getrandom = "0.2"
thiserror = "1"
crc32c = "0.6"

[dev-dependencies]