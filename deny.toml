# cargo-deny configuration (ADR-0005: no-network is checkable, not promised).

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436 "unmaintained" — paste is a compile-time proc-macro
    # pulled in by ratatui 0.29; no vulnerability, not reachable at runtime.
    # Revisit when ratatui drops the dependency.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "CC0-1.0",
]

[bans]
# ADR-0005 §1: no HTTP/TLS client anywhere in the tree — including transitive
# dependencies.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "isahc" },
    { name = "curl" },
    { name = "http" },
    { name = "http-body" },
    { name = "tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
