doc = false
bench = false

[[bin]]
name = "parse_index"
path = "fuzz_targets/parse_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_item"
path = "fuzz_targets/parse_item.rs"
test = false
doc = false
bench = false

[[bin]]
name = "split_item_frames"
path = "fuzz_targets/split_item_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "otpauth_uri"
path = "fuzz_targets/otpauth_uri.rs"
test = false
doc = false
bench = false
